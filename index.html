<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACHX Moto Challenge</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">


<!-- LOADING -->

<div id="loadingScreen">

    <h1>
        <span>ACHX</span> MOTO
    </h1>

    <p>
        Challenge
    </p>

    <div id="loadingBar">
        <div id="loadingProgress"></div>
    </div>

</div>


<!-- MAIN MENU -->

<div id="menu">


<h1>
    ACHX Moto Challenge
</h1>


<p>
    Professional Motorcycle Game
</p>


<button id="playBtn">
    PLAY
</button>


<button id="garageBtn">
    GARAGE
</button>


<button id="settingsBtn">
    SETTINGS
</button>


<button id="aboutBtn">
    ABOUT
</button>


</div>


</div>

<!-- GAME SCREEN -->

<div id="gameScreen" class="hidden">


    <!-- TOP HUD -->

    <div id="topHud">

        <div class="hudBox">

            LEVEL

            <span id="level">
                1
            </span>

        </div>


        <div class="hudBox">

            COINS

            <span id="coins">
                0
            </span>

        </div>


        <div class="hudBox">

            SCORE

            <span id="score">
                0
            </span>

        </div>


    </div>



    <!-- CANVAS -->

    <canvas id="gameCanvas"></canvas>



    <!-- SPEED -->

    <div id="speedPanel">

        <span id="speed">
            0
        </span>

        KM/H

    </div>



    <!-- PAUSE -->

    <button id="pauseBtn">

        ⏸

    </button>



    <!-- TOUCH CONTROLS -->

    <div id="controls">


        <button id="leftBtn">

            ◀

        </button>



        <button id="rightBtn">

            ▶

        </button>



        <button id="gasBtn">

            GAS

        </button>



        <button id="brakeBtn">

            BRAKE

        </button>



    </div>


<script src="game.js"></script>


</body>

</html>
